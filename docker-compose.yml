services:
  web:
    build:
      context: .
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.alobo.vn/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-wss://api.alobo.vn}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_OWNER_APP_URL: ${VITE_OWNER_APP_URL:-https://alobo.vn/app}
    image: alobo/booking-web:latest
    ports:
      - '8080:80'
    restart: unless-stopped

  web-dev:
    build:
      context: .
      target: dev
    profiles: ['dev']
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    ports:
      - '5173:5173'
    command: npm run dev -- --host 0.0.0.0
